name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Tests and release check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            unified_ocr_app/requirements.txt
            unified_ocr_app/pyproject.toml

      - name: Install system OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ghostscript tesseract-ocr poppler-utils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest unified_ocr_app

      - name: Run release safety check
        run: python unified_ocr_app/release_check.py
